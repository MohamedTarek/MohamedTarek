<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="460" rx="14" fill="#080c18"/>
  <rect width="900" height="460" rx="14" fill="url(#grid)"/>
  <rect width="900" height="460" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="459" rx="14" fill="none" stroke="#3b82f6" stroke-opacity="0.18"/>

  <!-- decorative crosshairs -->
  <g stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1">
    <path d="M 846 30 h 24 M 858 18 v 24"/>
    <path d="M 30 424 h 24 M 42 412 v 24"/>
  </g>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="28" y="28" width="560" height="404" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.2"/>
    <rect x="28" y="28" width="560" height="36" rx="10" fill="#1e293b"/>
    <rect x="28" y="54" width="560" height="10" fill="#1e293b"/>
    <circle cx="48" cy="46" r="5" fill="#f43f5e"/>
    <circle cx="66" cy="46" r="5" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="5" fill="#10b981"/>
    <text x="308" y="50" text-anchor="middle" fill="#64748b" font-size="12">~/mohamed-tarek</text>
  </g>

  <g fill="#f1f5f9">
    <text x="48" y="92"><tspan fill="#10b981">$</tspan> whoami</text>
    <text x="48" y="114" fill="#10b981">mohamed.tarek</text>

    <text x="48" y="140"><tspan fill="#10b981">$</tspan> cat experience.yml</text>
    <text x="48" y="162"><tspan fill="#94a3b8">role:</tspan>      <tspan fill="#3b82f6">Engineering Lead @ Batsync</tspan></text>
    <text x="48" y="184"><tspan fill="#94a3b8">years:</tspan>     <tspan fill="#3b82f6">12+</tspan></text>
    <text x="48" y="206"><tspan fill="#94a3b8">focus:</tspan>     <tspan fill="#3b82f6">distributed_systems</tspan></text>
    <text x="48" y="228"><tspan fill="#94a3b8">deploys:</tspan>   <tspan fill="#f59e0b">zero_downtime</tspan></text>
    <text x="48" y="250"><tspan fill="#94a3b8">location:</tspan>  <tspan fill="#8b5cf6">Cairo, Egypt</tspan></text>
    <text x="48" y="272"><tspan fill="#94a3b8">stack:</tspan></text>
    <text x="48" y="294" fill="#cbd5e1">  - PHP / Laravel · Node.js / Go</text>
    <text x="48" y="316" fill="#cbd5e1">  - AWS / K8s / Docker</text>
    <text x="48" y="338" fill="#cbd5e1">  - MySQL / PostgreSQL / MongoDB · Redis / RabbitMQ</text>

    <text x="48" y="366"><tspan fill="#10b981">$</tspan> composer show mohamedtarek/*</text>
    <text x="48" y="388" fill="#cbd5e1">laravel-stampede-guard  <tspan fill="#64748b">cache stampede prevention, Laravel 6 to 13</tspan></text>

    <text x="48" y="416"><tspan fill="#10b981">$</tspan> <tspan fill="#3b82f6">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- stat tiles -->
  <g font-family="'Outfit', 'Inter', system-ui, sans-serif">
    <g transform="translate(616 28)">
      <rect width="256" height="88" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.2"/>
      <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#3b82f6"/>
      <text x="20" y="46" fill="#3b82f6" font-size="30" font-weight="700">12+</text>
      <text x="20" y="70" fill="#64748b" font-size="11" letter-spacing="1.5">YEARS ENGINEERING</text>
    </g>
    <g transform="translate(616 133)">
      <rect width="256" height="88" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.2"/>
      <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#10b981"/>
      <text x="20" y="46" fill="#10b981" font-size="30" font-weight="700">90%</text>
      <text x="20" y="70" fill="#64748b" font-size="11" letter-spacing="1.5">CLOUD COST CUT</text>
    </g>
    <g transform="translate(616 238)">
      <rect width="256" height="88" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.2"/>
      <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#f59e0b"/>
      <text x="20" y="46" fill="#f59e0b" font-size="30" font-weight="700">Zero</text>
      <text x="20" y="70" fill="#64748b" font-size="11" letter-spacing="1.5">DOWNTIME MIGRATION</text>
    </g>
    <g transform="translate(616 343)">
      <rect width="256" height="89" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.2"/>
      <rect x="0" y="0" width="3" height="89" rx="1.5" fill="#8b5cf6"/>
      <text x="20" y="46" fill="#8b5cf6" font-size="30" font-weight="700">50 → 1</text>
      <text x="20" y="70" fill="#64748b" font-size="11" letter-spacing="1.5">STAMPEDE RECOMPUTES</text>
    </g>
  </g>
</svg>
